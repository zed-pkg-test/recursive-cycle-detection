[package]
org = "zed-pkg-test"
name = "recursive-cycle-detection"
version = "0.1.0"
description = "Independent package acceptance harness"
license = "MIT"

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg-test/recursive-cycle-detection"

[install]
dir = ".vendor/.zed"

[dependencies]
"zed/zed-cli" = "*"

[publish]
exclude = ["artifacts/**", "vendor/**", ".vendor/**", ".env", ".env.*"]
